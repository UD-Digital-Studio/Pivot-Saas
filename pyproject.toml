[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pivot-sass"
version = "0.1.0"
description = "Plateforme SaaS de gestion et de suivi de projets de construction"
requires-python = ">=3.13"
dependencies = [
    "Django>=5.1,<6.0",
    "Pillow>=11,<12",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "pymesomb>=2.1.1,<3",
    "xhtml2pdf>=0.2.17,<0.3",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["_bmad", "_bmad-output", "pytest-cache-files-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
