{% load i18n %}
<dialog id="modal-project-edit" data-app-modal class="m-auto w-[min(94vw,48rem)] rounded-2xl bg-white p-0 text-slate-900 shadow-2xl backdrop:bg-slate-950/60 backdrop:backdrop-blur-sm">
    <form method="post" action="{% url 'projects:update' project.pk %}" enctype="multipart/form-data">
        {% csrf_token %}
        <header class="flex items-center justify-between border-b border-slate-200 px-5 py-4 sm:px-6"><div><h2 class="text-lg font-black">{% translate "Modifier le projet" %}</h2><p class="mt-0.5 text-xs text-slate-500">{{ project.name }}</p></div><button type="button" data-modal-close class="grid size-9 place-items-center rounded-lg text-xl text-slate-400 hover:bg-slate-100" aria-label="{% translate "Fermer" %}">{% translate "×" %}</button></header>
        <div class="grid max-h-[70vh] gap-4 overflow-y-auto p-5 sm:grid-cols-2 sm:p-6 [&_input]:mt-1.5 [&_input]:w-full [&_input]:rounded-lg [&_input]:border [&_input]:border-slate-300 [&_input]:bg-slate-50 [&_input]:px-3 [&_input]:py-2.5 [&_select]:mt-1.5 [&_select]:w-full [&_select]:rounded-lg [&_select]:border [&_select]:border-slate-300 [&_select]:bg-slate-50 [&_select]:px-3 [&_select]:py-2.5 [&_textarea]:mt-1.5 [&_textarea]:w-full [&_textarea]:rounded-lg [&_textarea]:border [&_textarea]:border-slate-300 [&_textarea]:bg-slate-50 [&_textarea]:px-3 [&_textarea]:py-2.5">{% for field in edit_form %}<div class="{% if field.name == 'name' or field.name == 'description' or field.name == 'cover_image' %}sm:col-span-2{% endif %}"><label class="text-sm font-bold text-slate-700" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}</div>{% endfor %}</div>
        <footer class="flex justify-end gap-2 border-t border-slate-200 bg-slate-50 px-5 py-4 sm:px-6"><button type="button" data-modal-close class="rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-bold text-slate-600">{% translate "Annuler" %}</button><button type="submit" class="rounded-lg bg-pivot-600 px-4 py-2.5 text-sm font-black text-white">{% translate "Enregistrer" %}</button></footer>
    </form>
</dialog>
