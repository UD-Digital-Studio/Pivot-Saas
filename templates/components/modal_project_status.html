{% load i18n %}
<dialog id="modal-project-status" data-app-modal class="m-auto w-[min(94vw,32rem)] rounded-2xl bg-white p-0 text-slate-900 shadow-2xl backdrop:bg-slate-950/60 backdrop:backdrop-blur-sm">
    <form method="post" action="{% url 'projects:status-update' project.pk %}">
        {% csrf_token %}
        <header class="flex items-center justify-between border-b border-slate-200 px-5 py-4 sm:px-6"><div><h2 class="text-lg font-black">{% translate "Changer le statut" %}</h2><p class="mt-0.5 text-xs text-slate-500">{% translate "Statut actuel :" %} {{ project.get_status_display }}</p></div><button type="button" data-modal-close class="grid size-9 place-items-center rounded-lg text-xl text-slate-400 hover:bg-slate-100" aria-label="{% translate "Fermer" %}">{% translate "×" %}</button></header>
        <div class="p-5 sm:p-6"><label for="{{ status_form.status.id_for_label }}" class="mb-2 block text-sm font-bold text-slate-700">{{ status_form.status.label }}</label><div class="[&_select]:w-full [&_select]:rounded-xl [&_select]:border [&_select]:border-slate-300 [&_select]:bg-white [&_select]:px-4 [&_select]:py-3 [&_select]:text-sm [&_select]:outline-none focus-within:[&_select]:border-pivot-500">{{ status_form.status }}</div><p class="mt-3 text-xs leading-5 text-slate-500">{% translate "Le changement sera horodaté et ajouté au journal d’audit." %}</p></div>
        <footer class="flex justify-end gap-2 border-t border-slate-200 bg-slate-50 px-5 py-4 sm:px-6"><button type="button" data-modal-close class="rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-bold text-slate-600">{% translate "Annuler" %}</button><button type="submit" class="rounded-lg bg-pivot-600 px-4 py-2.5 text-sm font-black text-white">{% translate "Confirmer" %}</button></footer>
    </form>
</dialog>
