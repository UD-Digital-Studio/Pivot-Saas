{% load i18n %}
<dialog id="modal-project-members" data-app-modal class="m-auto w-[min(94vw,42rem)] rounded-2xl bg-white p-0 text-slate-900 shadow-2xl backdrop:bg-slate-950/60 backdrop:backdrop-blur-sm">
    <form method="post" action="{% url 'projects:members' project.pk %}">
        {% csrf_token %}
        <header class="flex items-center justify-between border-b border-slate-200 px-5 py-4 sm:px-6"><div><h2 class="text-lg font-black">{% translate "Membres du projet" %}</h2><p class="mt-0.5 text-xs text-slate-500">{{ project.name }}</p></div><button type="button" data-modal-close class="grid size-9 place-items-center rounded-lg text-xl text-slate-400 hover:bg-slate-100" aria-label="{% translate "Fermer" %}">{% translate "×" %}</button></header>
        <div class="max-h-[65vh] overflow-y-auto p-5 sm:p-6 [&_ul]:grid [&_ul]:gap-3 sm:[&_ul]:grid-cols-2 [&_li]:list-none [&_label]:flex [&_label]:cursor-pointer [&_label]:items-center [&_label]:gap-3 [&_label]:rounded-xl [&_label]:border [&_label]:border-slate-200 [&_label]:p-4 hover:[&_label]:bg-slate-50 [&_input]:size-4 [&_input]:accent-pivot-600">{{ members_form.members }}{% if not members_form.fields.members.queryset.exists %}<div class="rounded-xl border border-dashed border-slate-300 bg-slate-50 p-8 text-center text-sm text-slate-500">{% translate "Aucun client ou responsable actif disponible." %}</div>{% endif %}</div>
        <footer class="flex justify-end gap-2 border-t border-slate-200 bg-slate-50 px-5 py-4 sm:px-6"><button type="button" data-modal-close class="rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-bold text-slate-600">{% translate "Annuler" %}</button><button type="submit" class="rounded-lg bg-pivot-600 px-4 py-2.5 text-sm font-black text-white">{% translate "Enregistrer" %}</button></footer>
    </form>
</dialog>
