<section class="mt-6 grid grid-cols-3 gap-3" aria-label="Compteurs de collaboration">
    <article class="rounded-xl border border-slate-200 bg-white p-4 text-center"><p class="text-2xl font-black">{{ collaboration_counts.documents }}</p><p class="text-xs font-bold text-slate-500">Documents</p></article>
    <article class="rounded-xl border border-slate-200 bg-white p-4 text-center"><p class="text-2xl font-black">{{ collaboration_counts.photos }}</p><p class="text-xs font-bold text-slate-500">Photos</p></article>
    <article class="rounded-xl border border-slate-200 bg-white p-4 text-center"><p class="text-2xl font-black">{{ collaboration_counts.comments }}</p><p class="text-xs font-bold text-slate-500">Commentaires</p></article>
</section>
{% if selected_tab == 'documents' %}
<form method="get" class="mt-4 grid gap-2 rounded-xl border border-slate-200 bg-white p-4 sm:grid-cols-[minmax(12rem,1fr)_11rem_12rem_auto]">
    <input type="hidden" name="tab" value="documents">
    <input type="search" name="document_q" value="{{ document_query }}" placeholder="Rechercher un document" class="rounded-lg border border-slate-300 px-3 py-2.5 text-sm">
    <select name="document_status" class="rounded-lg border border-slate-300 px-3 py-2.5 text-sm"><option value="">Tous les statuts</option>{% for value,label in document_statuses %}<option value="{{ value }}" {% if document_status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>
    <select name="document_sort" class="rounded-lg border border-slate-300 px-3 py-2.5 text-sm"><option value="uploaded_desc" {% if document_sort == 'uploaded_desc' %}selected{% endif %}>Plus récents</option><option value="uploaded_asc" {% if document_sort == 'uploaded_asc' %}selected{% endif %}>Plus anciens</option><option value="title_asc" {% if document_sort == 'title_asc' %}selected{% endif %}>Titre A–Z</option><option value="status_asc" {% if document_sort == 'status_asc' %}selected{% endif %}>Statut</option></select>
    <button class="rounded-lg bg-pivot-600 px-4 py-2.5 text-sm font-black text-white">Filtrer</button>
</form>
{% endif %}
