{% load i18n %}
<dialog id="modal-risk-rule" data-app-modal class="m-auto w-[min(94vw,36rem)] rounded-2xl bg-white p-0 shadow-2xl backdrop:bg-slate-950/55"><form method="post" action="{% url 'planning:inspection-risk-rule-create' project.pk %}">{% csrf_token %}<header class="border-b px-5 py-4"><h3 class="font-black">{% translate "Jalons nécessitant une inspection" %}</h3><p class="mt-1 text-xs text-slate-500">{% translate "Sélectionnez les étapes critiques à contrôler physiquement. Une anomalie de progression impose également une inspection." %}</p></header><div class="grid max-h-[65vh] gap-4 overflow-y-auto p-5">{% for field in inspection_risk_rule_form %}<label class="grid gap-1.5 text-sm font-bold">{{ field.label }}{{ field }}</label>{% endfor %}</div><footer class="flex justify-end gap-2 border-t p-4"><button type="button" data-modal-close class="rounded-lg border px-4 py-2">{% translate "Annuler" %}</button><button class="rounded-lg bg-pivot-600 px-4 py-2 font-black text-white">{% translate "Enregistrer la règle" %}</button></footer></form></dialog>
