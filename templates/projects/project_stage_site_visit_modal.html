<dialog id="modal-site-visit-{{ stage.pk }}" data-app-modal class="m-auto w-[min(94vw,34rem)] rounded-2xl bg-white p-0 shadow-2xl backdrop:bg-slate-950/55"><form method="post" action="{% url 'planning:stage-site-visit-create' project.pk stage.pk %}">{% csrf_token %}<header class="border-b px-5 py-4"><h3 class="font-black">Enregistrer la visite · {{ stage.title }}</h3></header><div class="grid max-h-[65vh] gap-4 overflow-y-auto p-5">{% for field in stage.site_visit_form %}<label class="grid gap-1.5 text-sm font-bold">{{ field.label }}{{ field }}</label>{% endfor %}</div><footer class="flex justify-end gap-2 border-t bg-slate-50 p-4"><button type="button" data-modal-close class="rounded-lg border px-4 py-2 text-sm font-bold">Annuler</button><button class="rounded-lg bg-pivot-600 px-4 py-2 text-sm font-black text-white">Enregistrer la visite</button></footer></form></dialog>
