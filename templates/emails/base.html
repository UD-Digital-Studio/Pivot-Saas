{% load i18n %}
<!doctype html>
<html lang="fr">
{% load static %}<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"></head>
<body style="margin:0;background:#f2f5fb;font-family:Arial,Helvetica,sans-serif;color:#111a31;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f2f5fb;padding:32px 12px;"><tr><td align="center">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:620px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 12px 36px rgba(0,21,127,.10);">
<tr><td style="height:7px;background:#00157f;font-size:0;">{% translate "&nbsp;" %}</td></tr>
<tr><td style="padding:28px 42px 20px;"><img src="{% if logo_url %}{{ logo_url }}{% else %}{{ protocol }}://{{ domain }}{% static 'images/Logo.png' %}{% endif %}" width="176" alt="{% translate "PIVOT Engineering" %}" style="display:block;width:176px;max-width:55%;height:auto;border:0;"></td></tr>
<tr><td style="padding:8px 42px 40px;">{% block content %}{% endblock %}</td></tr>
<tr><td style="background:#f8f9fd;border-top:1px solid #e7eaf3;padding:22px 42px;color:#74809a;font-size:12px;line-height:1.6;text-align:center;">{% translate "Cet e-mail a été envoyé automatiquement par PIVOT." %}<br>{% translate "Plateforme de gestion de vos chantiers" %}</td></tr>
</table></td></tr></table>
</body></html>
