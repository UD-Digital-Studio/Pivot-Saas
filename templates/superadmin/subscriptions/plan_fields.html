{% load i18n %}
<label class="text-sm font-bold">{% translate "Nom" %}<input name="name" value="{{ edit_plan.name|default:'' }}" required maxlength="100" class="mt-2 w-full rounded-xl border px-3 py-3"></label><label class="text-sm font-bold">{% translate "Code" %}<input name="code" value="{{ edit_plan.code|default:'' }}" required maxlength="60" class="mt-2 w-full rounded-xl border px-3 py-3"></label><label class="text-sm font-bold sm:col-span-2">{% translate "Description" %}<input name="description" value="{{ edit_plan.description|default:'' }}" maxlength="300" class="mt-2 w-full rounded-xl border px-3 py-3"></label><label class="text-sm font-bold">{% translate "Prix mensuel" %}<input type="number" min="0" name="monthly_price" value="{{ edit_plan.monthly_price|default:'' }}" required class="mt-2 w-full rounded-xl border px-3 py-3"></label><label class="text-sm font-bold">{% translate "Prix annuel" %}<input type="number" min="0" name="yearly_price" value="{{ edit_plan.yearly_price|default:'' }}" required class="mt-2 w-full rounded-xl border px-3 py-3"></label><label class="text-sm font-bold">{% translate "Devise" %}<input name="currency" value="{{ edit_plan.currency|default:'XAF' }}" maxlength="3" required class="mt-2 w-full rounded-xl border px-3 py-3"></label><label class="text-sm font-bold">{% translate "Ordre" %}<input type="number" min="0" name="display_order" value="{{ edit_plan.display_order|default:'0' }}" required class="mt-2 w-full rounded-xl border px-3 py-3"></label><label class="text-sm font-bold">{% translate "Projets actifs max" %}<input type="number" min="1" name="max_active_projects" value="{{ edit_plan.max_active_projects|default:'' }}" class="mt-2 w-full rounded-xl border px-3 py-3"></label><label class="text-sm font-bold">{% translate "Membres internes max" %}<input type="number" min="1" name="max_internal_members" value="{{ edit_plan.max_internal_members|default:'' }}" class="mt-2 w-full rounded-xl border px-3 py-3"></label><label class="text-sm font-bold">{% translate "Stockage Mo" %}<input type="number" min="1" name="storage_limit_mb" value="{{ edit_plan.storage_limit_mb|default:'' }}" class="mt-2 w-full rounded-xl border px-3 py-3"></label><div class="space-y-2 pt-2 text-sm"><label class="flex gap-2"><input type="checkbox" name="advanced_reports_enabled" {% if edit_plan.advanced_reports_enabled %}checked{% endif %}> {% translate "Rapports avancés" %}</label><label class="flex gap-2"><input type="checkbox" name="ai_assistant_enabled" {% if edit_plan.ai_assistant_enabled %}checked{% endif %}> {% translate "Assistant IA" %}</label><label class="flex gap-2"><input type="checkbox" name="is_active" {% if not edit_plan or edit_plan.is_active %}checked{% endif %}> {% translate "Actif" %}</label><label class="flex gap-2"><input type="checkbox" name="is_public" {% if not edit_plan or edit_plan.is_public %}checked{% endif %}> {% translate "Visible au public" %}</label></div>
