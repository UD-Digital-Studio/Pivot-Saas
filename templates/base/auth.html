{% load static i18n %}
<!doctype html>
{% get_current_language as CURRENT_LANGUAGE %}<html lang="{{ CURRENT_LANGUAGE }}" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="{% static 'images/icon-blue.png' %}">
    <title>{% block title %}PIVOT{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { pivot: { 50:'#eef0ff',100:'#dfe3ff',500:'#263dbd',600:'#00157f',700:'#001064',950:'#000735' } }, boxShadow: { auth:'0 30px 80px -24px rgba(0,7,53,.55)' } } } }
    </script>
    <style>
        .auth-bg { background-image: linear-gradient(90deg, rgba(0,7,53,.30), rgba(15,23,42,.08)), url('{% static "images/auth-construction.png" %}'); }
        .auth-glass { background: rgba(255,255,255,.46); border: 1px solid rgba(255,255,255,.58); backdrop-filter: blur(12px) saturate(115%); -webkit-backdrop-filter: blur(12px) saturate(115%); }
        .password-field { position: relative; }
        .password-field input { padding-right: 3rem !important; }
        .password-toggle { position: absolute; inset-block: 0; right: .25rem; display: grid; width: 2.5rem; place-items: center; color: #64748b; }
        .password-toggle:hover { color: #00157f; }
        .auth-glass form { margin-top: 1.25rem !important; row-gap: .75rem !important; }
        .auth-glass form input, .auth-glass form select { padding-top: .625rem !important; padding-bottom: .625rem !important; }
        section[aria-labelledby="login-title"] aside svg { height: 6rem !important; max-width: 15rem !important; margin-top: .75rem !important; margin-bottom: .75rem !important; }
        section > aside > div.my-10 { margin-top: 1.5rem !important; margin-bottom: 1.5rem !important; }
        section > aside > div.my-10 h1 { margin-top: .75rem !important; font-size: 1.5rem !important; line-height: 2rem !important; }
        section > aside > div.my-10 p { margin-top: .5rem !important; }
        .auth-compact .auth-glass { padding-top: 1.5rem !important; padding-bottom: 1.5rem !important; }
        .auth-compact .auth-glass form { margin-top: 1rem !important; gap: .5rem 1rem !important; }
        .auth-compact .auth-glass form > div { margin-top: .5rem !important; }
        .auth-compact .auth-glass form input, .auth-compact .auth-glass form select { margin-top: .25rem !important; padding-top: .5rem !important; padding-bottom: .5rem !important; font-size: .875rem; color: #0f172a; }
        .auth-compact .auth-glass form label { font-size: .8125rem; color: #334155; }
        .auth-compact .auth-glass form button[type="submit"] { margin-top: .25rem; padding-top: .625rem; padding-bottom: .625rem; font-size: .8125rem; }
        .auth-compact .auth-glass > p { margin-top: .35rem !important; font-size: .8125rem; }
        .auth-glass input:not([type="checkbox"]):not([type="radio"]), .auth-glass select { min-height: 2.75rem; border-radius: .75rem !important; transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease; }
        .auth-glass input:focus, .auth-glass select:focus { border-color: #263dbd !important; box-shadow: 0 0 0 3px rgba(38,61,189,.16); outline: none; }
        button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid rgba(255,255,255,.75); outline-offset: 3px; }
    </style>
</head>
<body class="auth-bg min-h-full bg-cover bg-center bg-fixed text-slate-900 antialiased">
    {% get_current_language as CURRENT_LANGUAGE %}<details class="group fixed right-4 top-4 z-50"><summary class="flex h-11 cursor-pointer list-none items-center gap-2 rounded-xl border border-white/60 bg-white/65 px-3 shadow-lg backdrop-blur-md transition hover:bg-white/80 [&::-webkit-details-marker]:hidden" aria-label="{% translate 'Langue' %}"><img src="{% if CURRENT_LANGUAGE == 'fr' %}{% static 'images/flags/fr.svg' %}{% else %}{% static 'images/flags/gb.svg' %}{% endif %}" alt="" class="h-[18px] w-7 rounded-[2px] object-cover shadow-sm ring-1 ring-black/10"><svg class="size-3.5 text-pivot-700 transition group-open:rotate-180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></summary><form method="post" action="{% url 'set_language' %}" class="absolute right-0 top-12 w-44 overflow-hidden rounded-xl border border-white/70 bg-white/90 p-1.5 shadow-2xl backdrop-blur-xl">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button type="submit" name="language" value="fr" class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm font-semibold text-slate-700 hover:bg-pivot-50"><img src="{% static 'images/flags/fr.svg' %}" alt="" class="h-4 w-6 rounded-[2px] ring-1 ring-black/10"><span class="flex-1">Français</span>{% if CURRENT_LANGUAGE == 'fr' %}<span class="font-black text-pivot-600">✓</span>{% endif %}</button><button type="submit" name="language" value="en" class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm font-semibold text-slate-700 hover:bg-pivot-50"><img src="{% static 'images/flags/gb.svg' %}" alt="" class="h-4 w-6 rounded-[2px] ring-1 ring-black/10"><span class="flex-1">English</span>{% if CURRENT_LANGUAGE == 'en' %}<span class="font-black text-pivot-600">✓</span>{% endif %}</button></form></details>
    <main class="flex min-h-screen items-center justify-center bg-slate-950/10 px-4 py-8 sm:px-6">
        <div class="w-full max-w-6xl">
            {% if messages %}<div class="mx-auto mb-4 max-w-2xl space-y-2">{% for message in messages %}<div class="rounded-xl border border-emerald-200 bg-white/95 px-4 py-3 text-sm font-semibold text-emerald-800 shadow-lg">{{ message }}</div>{% endfor %}</div>{% endif %}
            {% block content %}{% endblock %}
        </div>
    </main>
    <script>
        document.querySelectorAll('input[type="password"]').forEach((input) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'password-field mt-2';
            input.parentNode.insertBefore(wrapper, input); wrapper.appendChild(input);
            const button = document.createElement('button');
            button.type = 'button'; button.className = 'password-toggle';
            const eye = '<svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>';
            const eyeOff = '<svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 3 18 18M10.6 10.7A2.5 2.5 0 0 0 14 14.3M9.8 5.8A10.8 10.8 0 0 1 12 5.6c6 0 9.5 6.4 9.5 6.4a17 17 0 0 1-2.1 2.8M6.3 6.4C3.9 8 2.5 12 2.5 12s3.5 6.4 9.5 6.4c1 0 2-.2 2.9-.5"/></svg>';
            button.innerHTML = eye; button.setAttribute('aria-label', 'Afficher le mot de passe');
            button.addEventListener('click', () => { const show = input.type === 'password'; input.type = show ? 'text' : 'password'; button.innerHTML = show ? eyeOff : eye; button.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe'); });
            wrapper.appendChild(button);
        });
    </script>
</body>
</html>
